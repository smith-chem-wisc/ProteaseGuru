name: Release

on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write   # required to attach the app zip to the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Verify commit exists in origin/master
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git merge-base --is-ancestor origin/master HEAD

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: |
          $version = &git describe --tags
          dotnet build --no-restore --configuration Release /p:Version=${version}
          
      - name: Test
        run: |
          $version = &git describe --tags
          dotnet test --configuration Release /p:Version=${version} --no-build
          
      - name: Pack and Push NuGet Package
        run: |
          $version = &git describe --tags
          nuget pack ProteaseGuru.nuspec -Version ${version} -Properties Configuration=Release
          dotnet nuget push ProteaseGuru.${version}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${env:NUGET_API_KEY}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_KEY }}

      - name: Publish Windows app (framework-dependent)
        run: |
          $version = &git describe --tags
          dotnet publish ProteaseGuruGui/ProteaseGuru.Gui.csproj --configuration Release --runtime win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=${version} `
            --output publish
          Rename-Item -Path publish/ProteaseGuru.Gui.exe -NewName ProteaseGuru.exe
          Compress-Archive -Path publish/* -DestinationPath ProteaseGuru.zip -Force

      - name: Attach app to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ProteaseGuru.zip
